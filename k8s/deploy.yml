apiVersion: apps/v1
kind: Deployment
metadata:
  name: overdrive-mercedes
  namespace: s-soham
  labels:
    app: overdrive-mercedes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overdrive-mercedes
  template:
    metadata:
      labels:
        app: overdrive-mercedes
    spec:
      containers:
        - name: web
          image: ghcr.io/sohamdhande/mercedes:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: overdrive-mercedes-svc
  namespace: s-soham
spec:
  selector:
    app: overdrive-mercedes
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
