name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy app
        run: |
          cd /home/soham
          if [ ! -d "mercedes" ]; then
            git clone https://github.com/sohamdhande/mercedes.git
          fi
          cd mercedes
          git fetch --all
          git reset --hard origin/main
          
          # Install dependencies and build
          npm install
          npm run build
          
          # Restart or start the app with PM2 on port 3050
          pm2 delete overdrive || true
          pm2 serve dist 3050 --name "overdrive" --spa
          pm2 save
