name: Sync Upstream & Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-updated]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: https://github.com/Injora/merc.git

jobs:
  sync:
    name: Check & Sync Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check_sync.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        id: check_sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream main

          COMMITS_BEHIND=$(git rev-list HEAD..upstream/main --count)
          echo "Commits behind upstream: $COMMITS_BEHIND"

          if [ "$COMMITS_BEHIND" -gt 0 ]; then
            echo "Merging changes from $UPSTREAM_REPO..."
            git merge upstream/main -m "chore: sync with upstream Injora/merc"
            git push origin main
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggered by ${{ github.event_name }}, proceeding with build."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No upstream changes. Skipping build."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push Docker Image
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      NST_TOKEN: ${{ secrets.NST_INIT_TOKEN }}
    steps:
      - name: Sync deployment on NST Init
        run: |
          if [ -n "$NST_TOKEN" ]; then
            echo "Syncing deployment with NST Init..."
            curl -f -s -X POST https://init.nstsdc.org/api/apps \
              -H "Authorization: Bearer $NST_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"appName":"overdrive","image":"ghcr.io/${{ github.repository }}:latest","port":80}'
          else
            echo "NST_INIT_TOKEN not set yet. Deployment image successfully updated in GHCR."
          fi
