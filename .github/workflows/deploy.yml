name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      NST_TOKEN: ${{ secrets.NST_INIT_TOKEN }}
    steps:
      - name: Sync deployment on NST Init
        run: |
          if [ -n "$NST_TOKEN" ]; then
            echo "Syncing deployment with NST Init..."
            curl -f -s -X POST https://init.nstsdc.org/api/apps \
              -H "Authorization: Bearer $NST_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"appName":"overdrive","image":"ghcr.io/${{ github.repository }}:latest","port":80}'
          else
            echo "NST_INIT_TOKEN not set yet. Deployment image successfully updated in GHCR."
          fi
